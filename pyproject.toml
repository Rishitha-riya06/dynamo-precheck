[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamo-precheck"
version = "0.2.0"
description = "Run the locally-checkable part of the Dynamo PR pipeline (static checks, image leak check, oracle/nop) with one command before you push."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rishitha" }]
keywords = ["dynamo", "harbor", "terminal-bench", "ci"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
dynamo-precheck = "dynamo_precheck.cli:main"

[project.urls]
Homepage = "https://github.com/Rishitha-riya06/dynamo-precheck"
Issues = "https://github.com/Rishitha-riya06/dynamo-precheck/issues"
